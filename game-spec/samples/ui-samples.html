<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>star-speed UI 样张</title>
<style>
  body { margin: 0; padding: 20px 16px 40px; background: #f2efe6; color: #1b2233; font-family: "Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; } h2 { font-size: 18px; margin: 28px 0 4px; }
  p { margin: 0 0 10px; font-size: 14px; line-height: 1.6; }
  .tag { position: fixed; top: 8px; right: 10px; font-size: 12px; padding: 4px 8px; background: rgba(0,0,0,.65); color: #fff; border-radius: 4px; z-index: 9; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  svg, canvas { display: block; width: 100%; height: auto; border-radius: 6px; image-rendering: pixelated; }
  .cap { font-size: 12px; opacity: .8; margin-top: 4px; }
</style>
</head>
<body>
<div class="tag">一次性样张，不是最终美术</div>
<div class="wrap" id="app"></div>
<script>
const C = { ink: '#1b2233', red: '#ef4a2f', yel: '#ffc93c', sky: '#4fb8e6', grn: '#2f9e6a', wht: '#f7ecd4' };
const S = (inner) => `<svg viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.sky}"/><stop offset="1" stop-color="${C.wht}"/></linearGradient></defs>${inner}</svg>`;
const base = () => `<rect width="480" height="150" fill="url(#sky)"/><polygon points="0,131 0,120 60,100 130,120 200,95 280,118 350,90 430,115 480,102 480,131" fill="#6f9fc0"/>
  <rect y="131" width="480" height="139" fill="#58b97a"/><path d="M70 270 Q210 165 300 131 L320 131 Q325 180 415 270 Z" fill="#4a5262"/>
  <path d="M240 270 Q288 170 310 132" fill="none" stroke="${C.yel}" stroke-width="3" stroke-dasharray="23 17"/>
  <path d="M0 0 H480 V20 Q240 46 0 20 Z" fill="${C.ink}"/><path d="M0 270 V224 Q240 194 480 224 V270 Z" fill="${C.ink}"/><path d="M0 224 Q240 194 480 224" fill="none" stroke="${C.red}" stroke-width="1.5"/>`;
const dial = (cx, cy, r, face, tick, needle, numCol, font, sw, edge) => {
  const P = (d, rr) => { const a = d * Math.PI / 180; return [(cx + rr * Math.cos(a)).toFixed(1), (cy + rr * Math.sin(a)).toFixed(1)]; };
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${face}" stroke="${edge}" stroke-width="${sw}"/>`;
  for (let i = 0; i <= 9; i++) { const d = 135 + 270 * i / 9, a = P(d, r - 9), b = P(d, r - 4); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${i >= 8 ? '#ff2a2a' : tick}" stroke-width="2"/>`; }
  const n = P(135 + 270 * 7.4 / 9, r - 7);
  return s + `<line x1="${cx}" y1="${cy}" x2="${n[0]}" y2="${n[1]}" stroke="${needle}" stroke-width="2.5" stroke-linecap="round"/><text x="${cx}" y="${cy + r * 0.62}" text-anchor="middle" font-size="${r * 0.55}" font-weight="bold" fill="${numCol}" font-family="${font}">5</text>`;
};
const hair = 'M0 44 V18 Q0 2 16 2 Q32 2 32 18 V26';
const line = '这辆车是为速度而生，它不是为了减速的。';
const opts = ['从存档点继续', '重新开始一圈', '退出'];
const F1 = "Consolas,'Microsoft YaHei',monospace", F2 = "'Arial Black','Microsoft YaHei',sans-serif";

const U = [
  { name: '1 · 车载投影', desc: '所有界面都像投影在挡风玻璃上：单一的琥珀黄细线和等宽字，没有底板。转速表是仪表台上的实体表盘。菜单和 Game Over 也是玻璃上的投影。界面最少、最不挡视线，和"坐在车里"的设定完全一致。',
    drive: () => base() + dial(240, 210, 26, '#111827', C.wht, C.red, C.yel, F1, 1.5, C.red)
      + `<g transform="translate(224,132)" fill="none" stroke="${C.yel}" stroke-linecap="round"><path d="${hair}" stroke-width="2.5"/><path d="M-22 50 H54 M-16 -6 H48" stroke-width="1" opacity=".6"/></g><polygon points="219,182 229,182 224,173" fill="${C.yel}"/>
        <text x="262" y="180" font-size="9" fill="${C.yel}" font-family="${F1}">发卡弯 ▸ 右</text>
        <text x="240" y="64" text-anchor="middle" font-size="11" fill="${C.yel}" font-family="${F1}">CEO ▸ ${line}</text><path d="M96 70 H384" stroke="${C.yel}" stroke-width="1" opacity=".6"/>
        <g transform="translate(396,96)"><polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="none" stroke="${C.yel}" stroke-width="1.5"/><text y="4" text-anchor="middle" font-size="9" fill="${C.yel}" font-family="${F1}">金</text><text y="32" text-anchor="middle" font-size="9" fill="${C.yel}" font-family="${F1}">森林 完成</text></g>`,
    over: () => `<rect width="480" height="270" fill="#07090f"/><text x="240" y="92" text-anchor="middle" font-size="26" letter-spacing="8" fill="${C.yel}" font-family="${F1}">GAME OVER</text><path d="M120 108 H360" stroke="${C.yel}" stroke-width="1" opacity=".6"/>`
      + opts.map((o, i) => `<text x="190" y="${146 + i * 28}" font-size="13" fill="${C.yel}" opacity="${i ? .6 : 1}" font-family="${F1}">${i ? '  ' : '▸ '}${o}</text>`).join('') },
  { name: '2 · 街机像素', desc: '粗边框的方块面板、大号粗体字、硬投影，颜色用朱红和金黄。转速表改成一排分段的色块条，旁边一个大档位数字框。界面本身很有存在感，像投币街机。',
    drive: () => base()
      + Array.from({ length: 14 }, (_, i) => `<rect x="${150 + i * 13}" y="232" width="10" height="${14 + i}" transform="translate(0,${-i})" fill="${i < 11 ? (i < 8 ? C.grn : C.yel) : (i < 12 ? C.red : '#3a4256')}" stroke="${C.wht}" stroke-width="1"/>`).join('')
      + `<rect x="338" y="216" width="34" height="34" fill="${C.ink}" stroke="${C.yel}" stroke-width="3"/><text x="355" y="243" text-anchor="middle" font-size="24" fill="${C.yel}" font-family="${F2}">5</text>
        <rect x="373" y="60" width="78" height="72" fill="#000" opacity=".35"/><rect x="368" y="55" width="78" height="72" fill="${C.ink}" stroke="${C.wht}" stroke-width="3"/><g transform="translate(392,68)" fill="none"><path d="${hair}" stroke="${C.yel}" stroke-width="4"/></g><rect x="388" y="110" width="8" height="8" fill="${C.red}"/>
        <rect x="64" y="150" width="360" height="30" fill="#000" opacity=".35"/><rect x="60" y="146" width="360" height="30" fill="${C.ink}" stroke="${C.yel}" stroke-width="3"/><text x="240" y="166" text-anchor="middle" font-size="11" fill="${C.wht}" font-family="${F2}">${line}</text>
        <rect x="34" y="60" width="120" height="40" fill="#000" opacity=".35"/><rect x="30" y="56" width="120" height="40" fill="${C.yel}" stroke="${C.ink}" stroke-width="3"/><text x="90" y="74" text-anchor="middle" font-size="12" fill="${C.ink}" font-family="${F2}">森林 完成</text><text x="90" y="90" text-anchor="middle" font-size="12" fill="${C.red}" font-family="${F2}">金牌！</text>`,
    over: () => `<rect width="480" height="270" fill="#0b0d16"/><text x="244" y="96" text-anchor="middle" font-size="40" fill="${C.yel}" font-family="${F2}">GAME OVER</text><text x="240" y="92" text-anchor="middle" font-size="40" fill="${C.red}" font-family="${F2}">GAME OVER</text>`
      + opts.map((o, i) => `<rect x="154" y="${124 + i * 38}" width="180" height="28" fill="#000"/><rect x="150" y="${120 + i * 38}" width="180" height="28" fill="${i ? C.ink : C.yel}" stroke="${C.wht}" stroke-width="3"/><text x="240" y="${139 + i * 38}" text-anchor="middle" font-size="13" fill="${i ? C.wht : C.ink}" font-family="${F2}">${o}</text>`).join('') },
  { name: '3 · 漫画分镜', desc: '白底加深色描边的对话气泡和斜切的字幕条，粗斜体字，重要信息用爆炸形的星芒框。转速表是带粗描边的圆表盘。界面带着夸张的情绪，贴近《Redline》那类动画的气质。',
    drive: () => base() + dial(240, 208, 30, C.wht, C.ink, C.red, C.ink, F2, 3, C.ink)
      + `<g transform="translate(240,150) rotate(45)"><rect x="-22" y="-22" width="44" height="44" fill="${C.yel}" stroke="${C.ink}" stroke-width="3"/></g><g transform="translate(226,130) scale(.8)" fill="none"><path d="${hair}" stroke="${C.ink}" stroke-width="5"/></g>
        <path d="M60 52 H400 Q412 52 412 64 V78 Q412 90 400 90 H120 L96 106 L102 90 H60 Q48 90 48 78 V64 Q48 52 60 52 Z" fill="#fff" stroke="${C.ink}" stroke-width="3"/><text x="230" y="76" text-anchor="middle" font-size="12" font-style="italic" fill="${C.ink}" font-family="${F2}">${line}</text>
        <polygon points="410,110 420,124 438,116 434,134 452,140 436,150 444,166 426,164 420,180 408,166 392,174 394,156 376,150 392,140 384,124 402,126" fill="${C.red}" stroke="${C.ink}" stroke-width="3"/><text x="414" y="142" text-anchor="middle" font-size="10" font-style="italic" fill="#fff" font-family="${F2}">森林</text><text x="414" y="156" text-anchor="middle" font-size="12" font-style="italic" fill="${C.yel}" font-family="${F2}">金！</text>`,
    over: () => `<rect width="480" height="270" fill="${C.ink}"/>` + Array.from({ length: 18 }, (_, i) => { const a = i * 20 * Math.PI / 180; return `<line x1="240" y1="85" x2="${240 + Math.cos(a) * 400}" y2="${85 + Math.sin(a) * 400}" stroke="${C.red}" stroke-width="10" opacity=".35"/>`; }).join('')
      + `<g transform="rotate(-6 240 85)"><rect x="90" y="56" width="300" height="56" fill="${C.red}" stroke="#fff" stroke-width="4"/><text x="240" y="98" text-anchor="middle" font-size="38" font-style="italic" fill="#fff" font-family="${F2}">GAME OVER</text></g>`
      + opts.map((o, i) => `<g transform="skewX(-12)"><rect x="${196 + i * 6}" y="${136 + i * 36}" width="190" height="26" fill="${i ? '#fff' : C.yel}" stroke="${C.ink}" stroke-width="3"/></g><text x="${262 - i * 2}" y="${154 + i * 36}" text-anchor="middle" font-size="13" font-style="italic" fill="${C.ink}" font-family="${F2}">${o}</text>`).join('') }
];
document.getElementById('app').innerHTML = `<h1>star-speed · UI 风格样张</h1><p>三种界面方向，背景都是已选定的"低多边形 + 像素化"画面。每种展示：驾驶中的界面（转速表与档位、HUD 小地图、CEO 字幕、区段贴纸提示）和失败后的 Game Over 菜单。</p>`
  + U.map(u => `<h2>${u.name}</h2><p>${u.desc}</p><div class="row"><div>${S(u.drive())}<div class="cap">驾驶中</div></div><div>${S(u.over())}<div class="cap">Game Over 菜单</div></div></div>`).join('');
document.querySelectorAll('#app svg').forEach(svg => {
  const img = new Image();
  img.onload = () => { const c = document.createElement('canvas'); c.width = 480; c.height = 270; c.getContext('2d').drawImage(img, 0, 0, 480, 270); svg.replaceWith(c); };
  const cl = svg.cloneNode(true); cl.setAttribute('width', 480); cl.setAttribute('height', 270);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(cl));
});
</script>
</body>
</html>
